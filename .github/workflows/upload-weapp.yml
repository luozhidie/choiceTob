name: Upload WeChat Mini Program (Native)

on:
  push:
    branches: [main]
    paths:
      - 'miniprogram-native/**'
      - '.github/workflows/upload-weapp.yml'
  workflow_dispatch:

jobs:
  upload-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install miniprogram-ci
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install miniprogram-ci --save-dev --no-audit --no-fund 2>&1 || npm install miniprogram-ci --save-dev --no-audit --no-fund 2>&1

      - name: Prepare dist from native code
        run: |
          set -e
          rm -rf ./dist-upload
          mkdir -p ./dist-upload
          cp -r ./miniprogram-native/* ./dist-upload/
          cp -r ./miniprogram-native/.??* ./dist-upload/ 2>/dev/null || true
          echo "dist files:"
          find ./dist-upload -type f | head -30

      - name: Upload to WeChat
        continue-on-error: true   # secret 私钥轮换后若未同步会失败；失败时仅告警，不阻断；本地直传兜底（见 upload-weapp.js）
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_KEY: ${{ secrets.WECHAT_UPLOAD_KEY }}
        run: |
          set -e
          cat > upload-native.js << 'UPLOADSCRIPT'
          const ci = require('./node_modules/miniprogram-ci');
          const fs = require('fs');
          const path = require('path');

          var appid = process.env.WECHAT_APPID || '';
          var keyPath = './private.key';
          var distPath = './dist-upload';

          console.log('Upload start...');
          console.log('appid:', appid ? 'OK' : 'MISSING');
          console.log('key:', fs.existsSync(keyPath) ? 'OK' : 'MISSING');
          console.log('dist:', fs.existsSync(distPath) ? 'OK' : 'MISSING');
          console.log('app.json exists:', fs.existsSync(distPath + '/app.json') ? 'YES' : 'NO');

          if (!fs.existsSync(keyPath)) {
            console.error('ERROR: private.key missing');
            process.exit(1);
          }
          if (!fs.existsSync(distPath + '/app.json')) {
            console.error('ERROR: app.json missing in dist');
            process.exit(1);
          }

          var project = new ci.Project({
            appid: appid,
            type: 'miniProgram',
            projectPath: path.resolve(distPath),
            privateKeyPath: path.resolve(keyPath)
          });

          ci.upload({
            project: project,
            version: String(process.env.GITHUB_RUN_NUMBER || '1'),
            desc: 'native v' + (process.env.GITHUB_RUN_NUMBER || '1') + ' auto upload',
            setting: { es6: true, es7: true, enhance: true, minify: false },
            robot: 1
          }).then(function() {
            console.log('=== UPLOAD SUCCESS ===');
          }).catch(function(e) {
            console.error('=== UPLOAD FAIL ===', e.message || e);
            process.exit(1);
          });
          UPLOADSCRIPT

          # 规范化私钥：Secret 粘贴时常见把真实换行存成字面 \n，导致 miniprogram-ci 解析失败
          if printf '%s' "$WECHAT_KEY" | grep -q '\\n'; then
            echo "[key] 检测到字面 \\n，已还原为真实换行"
            printf '%s' "$WECHAT_KEY" | sed 's/\\n/\n/g' > ./private.key
          else
            printf '%s' "$WECHAT_KEY" > ./private.key
          fi
          chmod 600 ./private.key
          echo "[key] 行数=$(wc -l < ./private.key) 首行=$(head -1 ./private.key | cut -c1-28) 尾行=$(tail -1 ./private.key | cut -c1-18)"
          if ! head -1 ./private.key | grep -q 'PRIVATE KEY'; then
            echo "::warning::私钥首行不是 -----BEGIN ... PRIVATE KEY-----，可能不是有效 PEM"
          fi
          node upload-native.js 2>upload_err.log || {
            echo "::error::上传失败 appid=[${WECHAT_APPID:-空}] 错误摘要: $(head -c 1200 upload_err.log | tr '\n' ' ')"
            exit 1
          }

      - name: Experience Version 提示（自研小程序需手动设为体验版）
        run: |
          echo "ℹ️ 自研小程序：微信未提供开放接口直接『设为体验版』（已实测 set_experience_version 等端点均返回 40066 invalid url）。"
          echo "   本次上传已生成「开发版」。请到 微信公众平台 → 版本管理 → 开发版本 → 最新上传（native v${{ github.run_number }}）→ 点「设为体验版」。"
          echo "   手机重扫体验版二维码即可看到本次更新。如需 CI 全自动，需改用微信开发者工具上传，或迁移到第三方平台代部署。"
